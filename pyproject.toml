[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist"
version = "0.2.0"
description = "Literature-informed protein binder design: an agent that orchestrates NVIDIA BioNeMo NIMs (RFdiffusion, ProteinMPNN, Boltz-2) into a ranked, cited report."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Anh Duong Vo" }]
keywords = ["protein-design", "drug-discovery", "bionemo", "agents", "llm", "nemotron"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "openai>=1.40",
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Live BioNeMo and Europe PMC calls
bio = ["requests>=2.31"]
# NeMo Agent Toolkit: run, evaluate, profile and serve the workflow
nat = ["nvidia-nat[langchain,eval,profiler,mcp]>=1.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.16.10", "requests>=2.31"]

[project.scripts]
sci = "ai_scientist.cli:app"

[project.entry-points.'nat.components']
ai_scientist = "ai_scientist.nat_plugin.register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
