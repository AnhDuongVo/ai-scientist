name: NAT integration
on:
  pull_request:
  workflow_dispatch:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,nat]"
      - run: pytest -q tests/test_regressions.py -k nat_plugin
