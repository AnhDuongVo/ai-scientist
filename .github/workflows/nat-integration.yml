name: NAT integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,nat]"
      - name: Require installed NAT dependency
        run: python -c "import nat; import ai_scientist.nat_plugin.register"
      - name: Execute NAT registration and simulated workflow
        run: pytest -q tests/test_regressions.py -k nat_plugin
